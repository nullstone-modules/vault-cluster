# Smoke-test the packer-builder workspace from this PR.
# GitHub will not dispatch build-ami.yml until it is on the default branch (master).
# pull_request workflows on this branch still run. This job does not bake an AMI.
name: test-packer-workspace

on:
  pull_request:
    paths:
      - .github/workflows/test-packer-workspace.yml
      - .github/workflows/build-ami.yml

permissions:
  id-token: write
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    env:
      NULLSTONE_ORG: nullstone
      NULLSTONE_API_KEY: ${{ secrets.NULLSTONE_API_KEY }}
      NULLSTONE_STACK: internal
      NULLSTONE_BLOCK: aws-packer-builder
      NULLSTONE_ENV: local
    steps:
      - uses: actions/checkout@v4

      - uses: nullstone-io/setup-nullstone-action@v0

      - name: Packer workspace outputs
        id: packer
        run: |
          role_arn=$(nullstone outputs --field=role_arn)
          aws_region=$(nullstone outputs --field=aws_region)
          test -n "$role_arn"
          test -n "$aws_region"
          echo "role_arn=$role_arn" >> "$GITHUB_OUTPUT"
          echo "aws_region=$aws_region" >> "$GITHUB_OUTPUT"
          echo "region=$aws_region"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.packer.outputs.role_arn }}
          aws-region: ${{ steps.packer.outputs.aws_region }}

      - name: Prove OIDC session
        run: aws sts get-caller-identity
